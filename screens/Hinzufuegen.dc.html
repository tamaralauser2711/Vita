<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hinzufügen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:'Inter',sans-serif;color:#111111}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Geist:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
</helmet>
<div role="dialog" aria-modal="true" aria-label="{{dialogLabel}}" style="position:absolute;top:0;left:0;width:390px;height:844px;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;font-family:'Inter',sans-serif;color:#111111;">
  <button type="button" onClick="{{close}}" aria-label="Schließen" style="all:unset;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(17,17,17,.45);cursor:pointer;"></button>
  <div style="position:relative;max-height:760px;background:#F3F1EC;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.15);">
    <div style="display:flex;justify-content:center;padding:10px 0 0;"><span style="width:40px;height:5px;border-radius:999px;background:#D3D0C8;"></span></div>
    <div style="overflow-y:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:24px;">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Geist',sans-serif;font-size:14px;font-weight:700;{{avatarStyle}}">{{initial}}</span>
          <div style="display:flex;flex-direction:column;">
            <span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">Eintragen für {{name}}</span>
            <span style="font-family:'DM Serif Display',Georgia,serif;font-size:18px;font-weight:400;letter-spacing:-0.01em;">{{heading}}</span>
          </div>
        </div>
        <button type="button" onClick="{{close}}" aria-label="Schließen" style="all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:#6F706D;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>

      <sc-if value="{{isChoose}}" hint-placeholder-val="{{true}}">
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;">
          <button type="button" onClick="{{pickFood}}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:1.5px solid #E6E3DC;">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1F4D3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"></path><path d="M17 21V3c-2 1-3.5 3.5-3.5 7h3.5"></path></svg>
            <span style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'DM Serif Display',Georgia,serif;font-size:15px;font-weight:400;letter-spacing:-0.01em;">Essen</span><span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">Mahlzeit oder Snack</span></span>
          </button>
          <button type="button" onClick="{{pickTraining}}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:1.5px solid #E6E3DC;">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1F4D3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg>
            <span style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'DM Serif Display',Georgia,serif;font-size:15px;font-weight:400;letter-spacing:-0.01em;">Training</span><span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">Sport, Spaziergang &amp; Co.</span></span>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{isFood}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <sc-for list="{{mealLinks}}" as="ml" hint-placeholder-count="4">
            <a href="{{ml.href}}" onClick="{{ml.go}}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:#111111;background:#FFFFFF;border:1px solid #E6E3DC;border-radius:16px;padding:16px 16px;">
              <span style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'Inter',sans-serif;font-size:14px;font-weight:600;">{{ml.label}}</span><span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">{{ml.sub}}</span></span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6F706D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </sc-for>
          <button type="button" onClick="{{back}}" style="all:unset;cursor:pointer;align-self:flex-start;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#6F706D;padding:8px 0;">Zurück</button>
        </div>
      </sc-if>

      <sc-if value="{{isTraining}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">Für heute, zusätzlich zu deinem Plan.</span>
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;flex-direction:column;gap:8px;">
              <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;">Was hast du gemacht?</span>
              <div style="display:flex;flex-wrap:wrap;gap:8px;">
                <sc-for list="{{actChips}}" as="ac" hint-placeholder-count="8">
                  <button type="button" onClick="{{ac.pick}}" aria-pressed="{{ac.pressed}}" style="padding:8px 12px;border-radius:999px;border:1px solid #E6E3DC;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;{{ac.style}}">{{ac.name}}</button>
                </sc-for>
              </div>
              <sc-if value="{{isOwnAct}}" hint-placeholder-val="{{false}}">
                <input type="text" aria-label="Eigene Aktivität" placeholder="z.B. Gartenarbeit, Stand-up-Paddling" value="{{fName}}" onInput="{{setFName}}" style="box-sizing:border-box;width:100%;padding:12px 12px;border-radius:10px;border:1px solid #E6E3DC;font-family:'Inter',sans-serif;font-size:13px;background:#FFFFFF;">
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <label for="{{durId}}" style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;">Dauer</label>
              <div style="display:flex;align-items:center;gap:12px;">
                <button type="button" onClick="{{decMin}}" aria-label="5 Minuten weniger" style="all:unset;box-sizing:border-box;flex:0 0 auto;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid #E6E3DC;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:20px;color:#111111;">−</button>
                <div style="flex:1;display:flex;align-items:baseline;justify-content:center;gap:8px;background:#F3F1EC;border:1px solid #E6E3DC;border-radius:16px;padding:8px 12px;">
                  <input id="{{durId}}" type="number" min="1" inputmode="numeric" value="{{fMin}}" onInput="{{setFMin}}" onKeyDown="{{blockMinus}}" style="width:70px;border:none;background:transparent;text-align:right;font-family:'Geist',sans-serif;font-size:24px;font-weight:700;color:#111111;padding:0;">
                  <span style="font-family:'Inter',sans-serif;font-size:13px;color:#6F706D;">Minuten</span>
                </div>
                <button type="button" onClick="{{incMin}}" aria-label="5 Minuten mehr" style="all:unset;box-sizing:border-box;flex:0 0 auto;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid #1F4D3A;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:20px;color:#1F4D3A;">+</button>
              </div>
              <div style="display:flex;gap:8px;">
                <sc-for list="{{minuteChips}}" as="mc" hint-placeholder-count="5">
                  <button type="button" onClick="{{mc.pick}}" aria-pressed="{{mc.pressed}}" style="flex:1;padding:8px 0;border-radius:10px;border:1px solid #E6E3DC;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;{{mc.style}}">{{mc.label}} Min</button>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;">Wie anstrengend?</span>
              <div style="display:flex;gap:8px;">
                <sc-for list="{{intensityChips}}" as="ic" hint-placeholder-count="3">
                  <button type="button" onClick="{{ic.pick}}" aria-pressed="{{ic.pressed}}" style="flex:1;padding:9px 0;border-radius:10px;border:1px solid #E6E3DC;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;{{ic.style}}">{{ic.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#E3EEE6;border-radius:16px;padding:12px 12px;">
              <span style="font-family:'Inter',sans-serif;font-size:12px;line-height:1.4;color:#1F4D3A;">{{previewLine}}</span>
              <span style="font-family:'Geist',sans-serif;font-size:16px;font-weight:700;color:#1F4D3A;white-space:nowrap;">{{previewKcal}}</span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <button type="button" onClick="{{cancelExtra}}" style="all:unset;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;color:#6F706D;padding:10px 0;">Abbrechen</button>
              <button type="button" onClick="{{saveExtra}}" style="all:unset;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#FFFFFF;background:#1F4D3A;padding:12px 20px;border-radius:999px;">Eintragen</button>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{hasSaved}}" hint-placeholder-val="{{false}}">
        <div style="background:#E3EEE6;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;color:#111111;">
          <span style="font-family:'DM Serif Display',Georgia,serif;font-size:16px;font-weight:400;letter-spacing:-0.01em;">Stark, ist eingetragen.</span>
          <span style="font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;color:#6F706D;">{{savedLine}}</span>
          <button type="button" onClick="{{close}}" style="all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:#1F4D3A;color:#FFFFFF;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:12px;border-radius:999px;">Fertig</button>
        </div>
      </sc-if>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"enum","options":["tami","cristian"],"default":"tami"},"closeFn":{"editor":null},"savedFn":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.initExtraForm();
    this.todayIndex = (new Date().getDay()+6)%7;
    this.state = { mode: 'choose', extras: this.loadExtras(), fAct: 'spazieren', fName: '', fMin: '30', fInt: 'mittel', saved: null };
  }
  initExtraForm() {
    this.actCatalog = [
      { id: 'spazieren', name: 'Spaziergang', met: 3.5 }, { id: 'schwimmen', name: 'Schwimmen', met: 7 },
      { id: 'laufen', name: 'Laufen', met: 9 }, { id: 'rad', name: 'Radfahren', met: 6.8 },
      { id: 'kraft', name: 'Krafttraining', met: 5 }, { id: 'yoga', name: 'Yoga', met: 3 },
      { id: 'fussball', name: 'Fußball', met: 8 }, { id: 'eigenes', name: 'Eigenes', met: 5 }
    ];
    this.bodyWeight = { tami: 63, cristian: 68 };
    this.intensities = [{ id: 'leicht', label: 'Locker', f: 0.8 }, { id: 'mittel', label: 'Mittel', f: 1 }, { id: 'intensiv', label: 'Intensiv', f: 1.25 }];
  }
  loadExtras() {
    try { return JSON.parse(localStorage.getItem('vitaExtraTraining') || '{}') || {}; } catch (e) { return {}; }
  }
  saveExtras(obj) {
    try { localStorage.setItem('vitaExtraTraining', JSON.stringify(obj)); } catch (e) {}
  }
  extrasFor(person, day) {
    const all = this.state.extras || {};
    return ((all[person] || {})[String(day)]) || [];
  }
  calcKcal(person, actId, minutes, intensityId) {
    const a = this.actCatalog.find((x) => x.id === actId) || this.actCatalog[0];
    const i = this.intensities.find((x) => x.id === intensityId) || this.intensities[1];
    const min = parseFloat(minutes) || 0;
    return Math.round((a.met * this.bodyWeight[person] * (min / 60) * i.f) / 5) * 5;
  }
  addExtra(person, day) {
    const s = this.state;
    const min = parseFloat(s.fMin) || 0;
    if (!(min > 0)) return null;
    const act = this.actCatalog.find((x) => x.id === s.fAct);
    const name = s.fAct === 'eigenes' ? ((s.fName || '').trim() || 'Eigene Aktivität') : act.name;
    const kcal = this.calcKcal(person, s.fAct, min, s.fInt);
    const intensity = this.intensities.find((x) => x.id === s.fInt).label;
    const all = { ...(s.extras || {}) };
    const pp = { ...(all[person] || {}) };
    pp[String(day)] = [...(pp[String(day)] || []), { id: Date.now(), name, minutes: min, intensity, kcal }];
    all[person] = pp;
    this.saveExtras(all);
    this.setState({ extras: all, addOpen: false, fName: '', fMin: '30', fAct: 'spazieren', fInt: 'mittel' });
    return kcal;
  }
  removeExtra(person, day, id) {
    const all = { ...(this.state.extras || {}) };
    const pp = { ...(all[person] || {}) };
    pp[String(day)] = (pp[String(day)] || []).filter((x) => x.id !== id);
    all[person] = pp;
    this.saveExtras(all);
    this.setState({ extras: all });
  }
  formVals(person, accent) {
    const s = this.state;
    const on = 'background:' + accent + ';color:' + '#FFFFFF' + ';border-color:' + accent + ';';
    const off = 'background:#FFFFFF;color:#111111;';
    const kcal = this.calcKcal(person, s.fAct, s.fMin, s.fInt);
    return {
      actChips: this.actCatalog.map((a) => ({ name: a.name, pressed: s.fAct === a.id ? 'true' : 'false', style: s.fAct === a.id ? on : off, pick: () => this.setState({ fAct: a.id }) })),
      isOwnAct: s.fAct === 'eigenes',
      fName: s.fName,
      setFName: (e) => this.setState({ fName: e.target.value }),
      durId: 'dauer-' + person,
      decMin: () => this.setState({ fMin: String(Math.max(5, (parseInt(this.state.fMin, 10) || 0) - 5)) }),
      incMin: () => this.setState({ fMin: String((parseInt(this.state.fMin, 10) || 0) + 5) }),
      minuteChips: [15, 30, 45, 60, 90].map((m) => ({ label: m + '', pressed: String(m) === String(s.fMin) ? 'true' : 'false', style: String(m) === String(s.fMin) ? on : off, pick: () => this.setState({ fMin: String(m) }) })),
      fMin: s.fMin,
      setFMin: (e) => this.setState({ fMin: e.target.value }),
      intensityChips: this.intensities.map((i) => ({ label: i.label, pressed: s.fInt === i.id ? 'true' : 'false', style: s.fInt === i.id ? on : off, pick: () => this.setState({ fInt: i.id }) })),
      previewLine: 'Geschätzter Verbrauch. Kommt direkt auf dein Kalorienziel drauf.',
      previewKcal: kcal > 0 ? '+ ' + kcal + ' kcal' : '0 kcal',
      cancelExtra: () => this.setState({ addOpen: false })
    };
  }
  renderVals() {
    const v = this.__nnRV();
    const keys = ["setFMin"];
    const clean = (e) => {
      if (e && e.target && typeof e.target.value === 'string' && /[-−]/.test(e.target.value)) {
        e.target.value = e.target.value.replace(/[-−]/g, '');
      }
    };
    const wrapObj = (o) => {
      keys.forEach((k) => {
        if (typeof o[k] === 'function' && !o[k].__nn) {
          const orig = o[k];
          const w = (e) => { clean(e); return orig(e); };
          w.__nn = true;
          o[k] = w;
        }
      });
    };
    wrapObj(v);
    Object.keys(v).forEach((k) => { if (Array.isArray(v[k])) v[k].forEach((it) => { if (it && typeof it === 'object') wrapObj(it); }); });
    v.blockMinus = (e) => { if (e && (e.key === '-' || e.key === '−' || e.key === '+' || e.key === 'e' || e.key === 'E')) e.preventDefault(); };
    return v;
  }
  __nnRV() {
    const s = this.state;
    const person = this.props.person === 'cristian' ? 'cristian' : 'tami';
    const name = person === 'tami' ? 'Tami' : 'Cristian';
    const close = () => { if (typeof this.props.closeFn === 'function') this.props.closeFn(); else this.setState({ mode: 'choose', saved: null }); };
    const headings = { choose: 'Was möchtest du eintragen?', food: 'Welche Mahlzeit?', training: 'Training eintragen', saved: 'Training eintragen' };
    const mode = s.saved ? 'saved' : s.mode;
    const extraToday = this.extrasFor(person, this.todayIndex).reduce((sum, x) => sum + x.kcal, 0);
    return {
      dialogLabel: 'Eintragen für ' + name,
      name: name,
      initial: name.charAt(0),
      avatarStyle: person === 'tami' ? 'background:#E3EEE6;color:#1F4D3A;' : 'background:#F5E3DA;color:#C4532D;',
      heading: headings[mode],
      close: close,
      isChoose: mode === 'choose',
      isFood: mode === 'food',
      isTraining: mode === 'training',
      hasSaved: mode === 'saved',
      pickFood: () => this.setState({ mode: 'food' }),
      pickTraining: () => this.setState({ mode: 'training' }),
      back: () => this.setState({ mode: 'choose' }),
      mealLinks: [['breakfast', 'Frühstück'], ['lunch', 'Mittag'], ['dinner', 'Abend'], ['snack', 'Snack']].map((m) => ({ href: 'Mahlzeiten.dc.html?meal=' + m[0], go: () => { try { localStorage.setItem('vitaSelectedMeal', m[0]); } catch (e) {} }, label: m[1], sub: 'Aus dem Plan, frei eintragen oder per Foto' })),
      ...this.formVals(person, '#1F4D3A'),
      cancelExtra: () => this.setState({ mode: 'choose' }),
      saveExtra: () => {
        const k = this.addExtra(person, this.todayIndex);
        if (k) {
          this.setState({ saved: { kcal: k } });
          if (typeof this.props.savedFn === 'function') this.props.savedFn(k);
        }
      },
      savedLine: s.saved ? ('Dein Kalorienziel steigt heute um ' + s.saved.kcal + ' kcal. Zusätzliches Training heute insgesamt: ' + (extraToday) + ' kcal.') : ''
    };
  }
}
</script>
</body>
</html>
