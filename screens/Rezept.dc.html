<html lang="de">
<head>

<title>Rezept &amp; Nährwerte</title>

  body{margin:0;font-family:'Inter',sans-serif;color:#111111}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Geist:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
</helmet>
<div role="dialog" aria-modal="true" aria-label="{{title}}" style="position:absolute;top:0;left:0;width:390px;height:844px;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;font-family:'Inter',sans-serif;color:#111111;">

    <div style="display:flex;justify-content:center;padding:10px 0 0;"><span style="width:40px;height:5px;border-radius:999px;background:#D3D0C8;"></span></div>
    <div style="flex:1 1 auto;overflow-y:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:24px;">

      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="display:flex;flex-direction:column;gap:4px;">

          <h2 style="margin:0;font-family:'DM Serif Display',Georgia,serif;font-size:19px;font-weight:400;letter-spacing:-0.01em;line-height:1.25;">{{title}}</h2>
        </div>
        <button type="button" onClick="{{close}}" aria-label="Schließen" style="all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;margin:-6px -10px 0 0;display:flex;align-items:center;justify-content:center;color:#6F706D;flex:0 0 auto;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:8px;">
        <button type="button" onClick="{{rateUp}}" aria-pressed="{{upPressed}}" aria-label="Hat geschmeckt" style="all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;{{upStyle}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="{{upFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
        <button type="button" onClick="{{rateDown}}" aria-pressed="{{downPressed}}" aria-label="Hat nicht geschmeckt" style="all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;{{downStyle}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3v11M21 5v7a2 2 0 0 1-2 2h-2l-4 7a2.5 2.5 0 0 1-2.4-3.1L11.5 14H6a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 7.2 3H17"></path></svg></button>
        <span style="flex:1;font-family:'Inter',sans-serif;font-size:12px;line-height:1.4;color:#6F706D;">{{rateNote}}</span>
      </div>

      <sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
        <span style="align-self:flex-start;font-family:'Inter',sans-serif;font-size:12px;padding:8px 12px;border-radius:10px;background:#F5E3DA;color:#8A4A34;">{{note}}</span>
      </sc-if>

      <div style="background:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <label for="rezept-gramm" style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;">Deine Menge (Grundrezept)</label>
          <button type="button" onClick="{{resetGrams}}" style="all:unset;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:4px 0;{{resetStyle}}">Laut Plan: {{planGrams}} g</button>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">

          <div style="flex:1;display:flex;align-items:baseline;justify-content:center;gap:8px;background:#F3F1EC;border:1px solid #E6E3DC;border-radius:16px;padding:8px 12px;">

          </div>

        </div>
        <sc-if value="{{hasOwnExtras}}" hint-placeholder-val="{{false}}">

        </sc-if>

            <span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">kcal</span>

          </sc-for>
        </div>
        <span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">{{per100}}</span>
      </div>

      <div style="background:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:4px;">
        <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6F706D;margin-bottom:4px;">Zutaten</span>

            <span style="flex:1;min-width:0;font-family:'Inter',sans-serif;font-size:13px;">{{ig.name}}</span>
            <span style="font-family:'Inter',sans-serif;font-size:13px;font-weight:600;white-space:nowrap;">{{ig.amount}}</span>
          </div>
        </sc-for>
        <sc-for list="{{extraGroups}}" as="eg" hint-placeholder-count="1">

            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Geist',sans-serif;font-size:12px;font-weight:700;{{eg.avatar}}">{{eg.initial}}</span>
              <span style="flex:1;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;{{eg.titleColor}}">{{eg.title}}</span>
              <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;{{eg.titleColor}}">{{eg.sum}}</span>
            </div>
            <sc-for list="{{eg.items}}" as="ei" hint-placeholder-count="2">
              <div style="display:flex;align-items:center;gap:8px;padding:4px 0 4px 30px;">
                <span aria-hidden="true" style="width:24px;height:24px;border-radius:50%;background:#FFFFFF;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;">{{ei.emoji}}</span>
                <span style="flex:1;min-width:0;font-family:'Inter',sans-serif;font-size:13px;">{{ei.name}}<span style="font-size:12px;color:#6F706D;">{{ei.note}}</span></span>
                <span style="font-family:'Inter',sans-serif;font-size:13px;font-weight:600;white-space:nowrap;">{{ei.amount}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>

      <div style="background:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;">
        <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6F706D;">Zubereitung</span>
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
          <div style="display:flex;gap:12px;align-items:flex-start;">
            <span style="width:24px;height:24px;border-radius:50%;background:#E3EEE6;color:#1F4D3A;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Geist',sans-serif;font-size:12px;font-weight:700;">{{st.n}}</span>
            <span style="font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;padding-top:2px;">{{st.text}}</span>
          </div>
        </sc-for>
      </div>

    </div>
    <div style="flex:0 0 auto;padding:12px 20px 22px;background:#F3F1EC;border-top:1px solid #E6E3DC;">
      <button type="button" onClick="{{confirm}}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:block;text-align:center;padding:15px;border-radius:999px;background:#1F4D3A;color:#FFFFFF;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;">{{actionText}}</button>
    </div>
  </div>
</div>
</x-dc>
