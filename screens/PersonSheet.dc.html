<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Personen & Profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:'Inter',sans-serif;color:#111111}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Geist:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
</helmet>
<div role="dialog" aria-modal="true" aria-label="Person wechseln oder Profil öffnen" style="position:absolute;top:0;left:0;width:390px;height:844px;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;font-family:'Inter',sans-serif;color:#111111;">
  <button type="button" onClick="{{close}}" aria-label="Schließen" style="all:unset;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(17,17,17,.45);cursor:pointer;"></button>
  <div style="position:relative;background:#F3F1EC;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.15);">
    <div style="display:flex;justify-content:center;padding:10px 0 0;"><span style="width:40px;height:5px;border-radius:999px;background:#D3D0C8;"></span></div>
    <div style="padding:16px 20px 32px;display:flex;flex-direction:column;gap:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-family:'DM Serif Display',Georgia,serif;font-size:22px;font-weight:400;letter-spacing:-0.01em;">Euer Haushalt</span>
        <button type="button" onClick="{{close}}" aria-label="Schließen" style="all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:#6F706D;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>

      <div style="background:#FFFFFF;border-radius:20px;padding:8px 16px;display:flex;flex-direction:column;">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="2">
          <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;{{p.rowStyle}}">
            <span style="width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Geist',sans-serif;font-size:15px;font-weight:700;{{p.avatarStyle}}">{{p.initial}}</span>
            <span style="flex:1;display:flex;flex-direction:column;gap:2px;">
              <span style="font-family:'Inter',sans-serif;font-size:14px;font-weight:600;">{{p.name}}</span>
              <span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">{{p.sub}}</span>
            </span>
            <sc-if value="{{p.active}}" hint-placeholder-val="{{false}}">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1F4D3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>

      <a href="Profil.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#111111;background:#FFFFFF;border-radius:20px;padding:16px;">
        <span style="width:40px;height:40px;border-radius:16px;background:#E3EEE6;color:#1F4D3A;flex:0 0 auto;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px;">
          <span style="font-family:'Inter',sans-serif;font-size:14px;font-weight:600;">Profil &amp; Einstellungen</span>
          <span style="font-family:'Inter',sans-serif;font-size:12px;color:#6F706D;">Ziel, Sport, Vorlieben, Haushalt, Supermärkte</span>
        </span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6F706D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"enum","options":["tami","cristian"],"default":"tami"},"pickFn":{"editor":null},"closeFn":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.person === 'cristian' ? 'cristian' : 'tami';
    const list = [
      { key: 'tami', name: 'Tami (du)', initial: 'T', sub: 'Abnehmen · 1.650 kcal', bg: '#E3EEE6', fg: '#1F4D3A' },
      { key: 'cristian', name: 'Cristian', initial: 'C', sub: 'Zunehmen · Profil geteilt', bg: '#F5E3DA', fg: '#C4532D' }
    ];
    const close = () => { if (typeof this.props.closeFn === 'function') this.props.closeFn(); };
    return {
      close,
      people: list.map((p, i) => ({
        name: p.name, initial: p.initial, sub: p.sub,
        active: p.key === cur,
        pressed: p.key === cur ? 'true' : 'false',
        rowStyle: i > 0 ? 'border-top:1px solid #EDEAE3;' : '',
        avatarStyle: 'background:' + p.bg + ';color:' + p.fg + ';',
        pick: () => { if (typeof this.props.pickFn === 'function') this.props.pickFn(p.key); }
      }))
    };
  }
}
</script>
</body>
</html>
